component: gate
variables:
    - name: verdict
      type: int
      direction: output
      description: verify exit code. 0 means all clear. 1 means open items. 2 means config error.
      range:
        max: 2
        min: 0
    - name: forced_item_count
      type: int
      direction: output
      description: Count of applicable items that are forced or failed open. 0 means the gate may return exit 0.
      range:
        max: 384
        min: 0
    - name: run_rc
      type: int
      direction: input
      description: Exit code of the @run command. 127 means the binary is absent.
      range:
        max: 127
        min: 0
    - name: omitted_applicable
      type: int
      direction: output
      description: Count of applicable @run or @attest items skipped by evaluation. 0 means every applicable item was executed or attested.
      range:
        max: 384
        min: 0
