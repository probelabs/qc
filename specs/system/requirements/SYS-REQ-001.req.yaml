id: SYS-REQ-001
version: 1
status: draft
priority: shall
category: functional
req_type: guarantee
fretish: the gate shall always satisfy (verdict = 0) => (forced_item_count = 0)
description: verify shall return exit code 0 only when forced_item_count is 0. verify shall return exit code 2 on a config error. Two machines that see the same worktree bytes, checklist files, state store, and clock shall return the same exit code. The gate shall not infer, guess, or use the network.
