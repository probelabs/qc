    - class: nominal
      worst_case: Every applicable item already has a matching evidenced answer, yet verdict is not 0, so a finished review cannot ship.
      severity: high
    - class: boundary
      worst_case: verdict=0 is returned while forced_item_count is greater than 0, so a passing exit hides a forced item.
      severity: critical
    - class: determinism
      worst_case: The same worktree bytes, checklist files, state store, and clock yield different exit codes across machines, so CI cannot reproduce the local gate.
      severity: high
    - class: error_handling
      worst_case: A config error returns exit 0 instead of 2, so a broken gate looks like all-clear.
      severity: high
