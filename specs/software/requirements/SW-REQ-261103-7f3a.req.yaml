description: >-
    qc add shall accept repeatable --set key=value and --set=key=value options
    before or after the template id, split each assignment at the first equals
    sign, and replace every qc placeholder throughout the copied template with
    the literal value. A qc placeholder is exactly {{key}} where key matches
    [A-Za-z_][A-Za-z0-9_-]*, with no spaces, dots or other characters. Only this
    form shall be substituted or treated as unresolved. Empty values are allowed;
    the last assignment to a key wins. Substitution shall not be recursive or
    change the source template.
    Missing arguments, assignments without an equals sign or with an empty key,
    and unresolved qc placeholders (including any remaining after substitution)
    shall exit 2 before writing the destination checklist. Any loaded checklist
    containing an unresolved qc placeholder shall be a parse error (exit 2),
    before scope evaluation can make the item dormant. Other brace text,
    including {{ key }}, {{.}}, {{ .Values.x }}, {{ user }} and an unclosed {{,
    shall pass through unchanged in templates and replacement values and shall
    never be a placeholder error.
