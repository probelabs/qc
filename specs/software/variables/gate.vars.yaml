component: gate
variables:
    - name: verdict
      type: int
      direction: output
      description: verify exit code. 0 means all clear. 1 means open items. 2 means config error.
      range:
        max: 2
        min: 0
    - name: forced_item_count
      type: int
      direction: output
      description: Count of applicable items that are forced or failed open. 0 means the gate may return exit 0.
      range:
        max: 384
        min: 0
    - name: expires_s
      type: int
      direction: input
      description: Item expiry in seconds. 0 means the answer does not age out.
      range:
        max: 3.1536e+07
        min: 0
    - name: answer_age_s
      type: int
      direction: internal
      description: Age of the winning attestation in seconds. Equal to clock minus answer_at_s.
      range:
        max: 4.1024448e+09
        min: 0
    - name: run_rc
      type: int
      direction: input
      description: Exit code of the @run command. 127 means the binary is absent.
      range:
        max: 127
        min: 0
