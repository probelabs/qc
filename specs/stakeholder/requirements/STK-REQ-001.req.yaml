obligation_hazards:
    - class: boundary
      worst_case: The empty forced set or expires_s=0 is misclassified, so a just-cleared worktree still fails or a still-forced set passes.
      severity: high
    - class: determinism
      worst_case: Two machines that see the same worktree, checklists, store, and clock return different verdicts, so CI green does not match the local gate.
      severity: high
    - class: error_handling
      worst_case: A config or store read error is treated as all-clear (exit 0), so forced items never surface and the agent ships unreviewed change.
      severity: high
    - class: nominal
      worst_case: An applicable item already has a matching evidenced answer, yet verify still exits 1, so a finished review cannot ship.
      severity: high
