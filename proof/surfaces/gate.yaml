group: gate
surfaces:
  - id: gate.verdict
    description: "verify exit code and plan worklist must report the same forced set"
    dual_surface: true
    location:
      paths:
        - src/commands.c
        - src/states.c
    detect:
      method: pattern
      pattern: "int cmd_verify"
      min_matches: 1
    disposition:
      status: reviewed
      reason: "AC-DUAL-EQ: plan forced set ≡ verify exit. cmd_verify and qc_eval_all share the same eval; exit 0 iff no open items."
      ref: STK-REQ-001/AC-002
  - id: gate.human_refuse
    description: "@human items refuse by:agent; no scratch line is written"
    location:
      paths:
        - src/commands.c
    detect:
      method: pattern
      pattern: "this item is @human"
      min_matches: 1
    disposition:
      status: reviewed
      reason: "AC-ENFORCE: write_attestation dies before scratch write when item.human and by==agent."
      ref: STK-REQ-003/AC-002
  - id: gate.run_missing_fail
    description: "missing @run binary is FAILED (run_rc=127) with an install command, never skipped"
    location:
      paths:
        - src/states.c
        - src/commands.c
    detect:
      method: pattern
      pattern: "binary %s not found"
      min_matches: 1
    disposition:
      status: reviewed
      reason: "AC-EMPTY fail-closed: qc_run_cmd sets run_rc=127 and an install hint; print_eval does not skip."
      ref: STK-REQ-006/AC-002
  - id: gate.deny_evidence
    description: "deny_builtin and deny_evidence reject non-falsifiable evidence tokens"
    location:
      paths:
        - src/states.c
    detect:
      method: pattern
      pattern: "deny_builtin"
      min_matches: 1
    disposition:
      status: reviewed
      reason: "AC-ENFORCE: qc_evidence_ok rejects deny_builtin tokens such as lgtm/done before any scratch write."
      ref: STK-REQ-003/AC-003
  - id: gate.evidence_no_secret
    description: "evidence that looks like a credential is refused and never echoed"
    location:
      paths:
        - src/states.c
    detect:
      method: pattern
      pattern: "secret_hit"
      min_matches: 1
    disposition:
      status: reviewed
      reason: "AC-ENFORCE: secret_hit rejects ghp_/BEGIN PRIVATE KEY; die message does not print the token."
      ref: STK-REQ-003/AC-004
