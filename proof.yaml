project:
    name: qc
    specs:
        - path: specs/stakeholder
          prefix: STK-REQ
          type: stakeholder
        - path: specs/system
          prefix: SYS-REQ
          type: system
          parent_spec: specs/stakeholder
        - path: specs/software
          prefix: SW-REQ
          type: subsystem
          parent_spec: specs/system
        - path: specs/integration
          prefix: INT-REQ
          type: integration
          parent_spec: specs/system
          cross_component: true
    id_format:
        pattern: '{prefix}-{date:YYMMDD}-{rand:4}'
        auto_increment: false
    signals:
        defaults: auto
        rule_packs:
            - signal-rules/c-ape.yaml
    documentation:
        sources:
            - path: docs/
              type: auto
            - path: README.md
              type: auto
            - path: SPEC.md
              type: auto
            - path: SKILL.md
              type: auto
        threshold: 80
    checks:
        slow_tests:
            enabled: true
        code_mcdc:
            advisory: false
            min_statement_percent: 100
            min_decision_percent: 100
            min_condition_percent: 100
            languages:
                c:
                    test_command: host-c
                    coverage_export: .proof/native/gcov/merged.gcov.json
            targets:
                - id: qc-c
                  enabled: true
                  language: c
                  scope: ./src
                  coverage_export: .proof/native/gcov/merged.gcov.json
                  exclude_paths: ['tests/**']
        property_fixtures_exist:
            enabled: true
        flip_fixtures_exist:
            enabled: true
        fixture_staleness_clean:
            enabled: true
        code_signal_obligations_reviewed:
            enabled: true
        code_signal_unbindable:
            enabled: true
        change_evidence_complete:
            enabled: true
        plan_of_record_current:
            enabled: true
        hazard_consequence:
            # Worst-case-first coverage gate: every in-scope obligation class must
            # carry an enumerated worst_case, so missing worst-cases surface as
            # findings instead of silent gaps.
            require_worst_case_scope: all
            require_prose_at_assurance: E
            require_checklist_at_assurance: E
    approval:
        agent_autonomous_for:
            all: true
    trace_policy:
        mode: source_native
    commands:
        build: make
        test: make test
        tests:
            host-c:
                language: c
                command: sh scripts/host-c-mcdc.sh
                mcdc_command: sh scripts/host-c-mcdc.sh
    scope: '**/*.{c,h}'
    description: Deterministic checklist gate for AI-driven development. Cosmopolitan APE binary. Every string is a prompt.
    checklists:
        active: none
